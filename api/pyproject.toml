[project]
name = "hr-analytics-api"
version = "0.1.0"
description = "FastAPI backend and Anthropic agent loop for the HR analytics sample"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "anthropic>=0.40",
    "mcp>=1.0",
    "psycopg[binary]>=3.2",
    "pyjwt>=2.8",
    "httpx>=0.27",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
