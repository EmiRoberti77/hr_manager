[project]
name = "hr-analytics-mcp-server"
version = "0.1.0"
description = "MCP tool layer for the conversational HR analytics sample app"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.0",
    "httpx>=0.27",
    "pyjwt>=2.8",
    "psycopg[binary]>=3.2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
